# CI：main への push と main 向けのプルリクエストごとに，コードの品質を確かめる．
#   check … Biome（lint・整形），TypeScript の型チェック，Vitest のユニットテスト
#   e2e   … 本番ビルドを作り，Playwright で Chromium・WebKit の E2E テスト
#           （Firefox は GPU のない CI では WebGL が使えず，地図を描けないので除く）
# E2E では経路計算 API を差し替えるので，ORS の API キーは要らない．
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同じブランチで新しい実行が始まったら，古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Lint・型チェック・ユニットテスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: 型チェック
        run: npm run typecheck
      - name: ユニットテスト
        run: npx vitest run

  e2e:
    name: ビルド・E2E テスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # better-auth は本番モードでは秘密鍵が必須．CI では DB にもつながないので，ダミーの値でよい
    env:
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-for-anything-real
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # ブラウザ本体はキャッシュし，OS の依存パッケージだけは毎回入れる
      - name: Playwright のバージョンを取得
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Playwright のブラウザをキャッシュ
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright のブラウザを入れる
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright の依存パッケージを入れる
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: 本番ビルド
        run: npm run build
      - name: E2E テスト
        run: npx playwright test --project=chromium --project=webkit

      - name: テストレポートを保存
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
